###############################################################################
# Edge reverse proxy.
#
# Nginx is the only service published to the host. `client` and `server` are
# reachable only across the internal Docker network, so the browser sees a
# single origin and the API needs no CORS preflight in the default setup.
###############################################################################

# Required so WebSocket upgrades pass through; the stock nginx.conf does not
# define this map. conf.d/*.conf is included in the http context, so it belongs
# here rather than in a server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream erp_client {
    server client:3000;
    keepalive 16;
}

upstream erp_server {
    server server:5000;
    keepalive 16;
}

# Blunt protection for the credential endpoints. Tuned low deliberately: these
# are interactive logins, not machine traffic.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Large enough for the bulk-import spreadsheets and contract PDFs the app
    # accepts; multer enforces the real per-field limits downstream.
    client_max_body_size 25m;

    # The upstreams set their own; these cover anything served directly by Nginx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # --- Proxy health, answered by Nginx itself ------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- API -----------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://erp_server;
    }

    location /api/ {
        proxy_pass http://erp_server;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Swagger UI, mounted by the backend outside the /api prefix.
    location /api-docs {
        proxy_pass http://erp_server;
    }

    # --- Next.js static assets ----------------------------------------------
    # Content-hashed and therefore safe to cache immutably at the edge.
    location /_next/static/ {
        proxy_pass http://erp_client;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Application ---------------------------------------------------------
    location / {
        proxy_pass http://erp_client;

        # Required for Next's dev-mode HMR socket; inert in production.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
