###############################################################################
# Enterprise ERP: local orchestration.
#
# Network isolation is the point of this file. Only `nginx` publishes a port to
# the host. `client` and `server` sit on the `edge` network; `mongo` and `redis`
# sit on `data`, which is marked `internal: true` and therefore has no route to
# or from the host or the internet. `server` is the only service on both, so it
# is the sole path to the datastores.
#
#   host ──▶ nginx ──▶ client          (edge)
#                  └─▶ server ──▶ mongo, redis   (data, internal)
###############################################################################

name: erp-platform

services:
  # --- Edge reverse proxy ----------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: erp-nginx
    restart: unless-stopped
    ports:
      - "${EDGE_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - edge
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Next.js frontend ------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Relative, so the browser calls the API through Nginx on the same
        # origin and never learns the internal service address.
        NEXT_PUBLIC_API_BASE_URL: /api
        NEXT_PUBLIC_BASE_URL: /
        NEXT_PUBLIC_CDN_HOSTNAME: ${NEXT_PUBLIC_CDN_HOSTNAME:-}
        NEXT_PUBLIC_EXTRA_IMAGE_HOSTS: ${NEXT_PUBLIC_EXTRA_IMAGE_HOSTS:-}
    image: erp-platform/client:${IMAGE_TAG:-local}
    container_name: erp-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Next middleware and server components run inside the container, so they
      # reach the API directly rather than looping back through the proxy.
      INTERNAL_API_BASE_URL: http://server:5000/api
    networks:
      - edge
    depends_on:
      server:
        condition: service_healthy

  # --- Express API -----------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: erp-platform/server:${IMAGE_TAG:-local}
    container_name: erp-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Service names resolve on the `data` network. `replicaSet` is required:
      # the app uses multi-document transactions, which standalone mongod
      # cannot serve.
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-erp_platform}?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - server-uploads:/app/uploads
    networks:
      - edge
      - data
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- MongoDB ---------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: erp-mongo
    restart: unless-stopped
    # `--quiet` matters for debugging, not performance: at default verbosity a
    # single mongod start emits hundreds of lines, which buries every other
    # service in `docker compose logs` and made a CI failure dump unreadable.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--quiet"]
    volumes:
      - mongo-data:/data/db
    networks:
      - data
    # Self-initiating single-node replica set: the first probe that finds no
    # config creates one. This keeps transaction support without a separate init
    # container.
    #
    # The probe then asserts a writable primary. `rs.initiate()` returns ok
    # immediately, while primary election takes a few seconds more, so reporting
    # healthy on initiate alone let `server` connect against a replica set with
    # no primary and exit. Failing until `isWritablePrimary` is true makes
    # `depends_on: service_healthy` mean what it says.
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status() } catch (e) {
        rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }
        if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 5s
      timeout: 10s
      start_period: 45s
      retries: 20

  # --- Redis -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required - run 'make init'}
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    # No gateway: datastores cannot reach the internet and the host cannot
    # reach them. Reaching them means going through `server`.
    internal: true

volumes:
  mongo-data:
  redis-data:
  server-uploads:
